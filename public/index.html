<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EstuLanches – Cantina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <h1 class="marca">EstuLanches</h1>
    <nav class="abas" role="tablist" aria-label="Áreas do sistema">
      <button class="aba" role="tab" id="aba-aluno" aria-selected="true" aria-controls="aluno">Sou aluno</button>
      <button class="aba" role="tab" id="aba-cozinha" aria-selected="false" aria-controls="cozinha">Cozinha (ADM)</button>
    </nav>
  </header>

  <main id="aluno" role="tabpanel" aria-labelledby="aba-aluno" class="aluno">
    <section aria-labelledby="t-cardapio">
      <h2 id="t-cardapio" class="titulo-secao">Escolha seus lanches</h2>
      <div id="menu" class="menu"></div>
    </section>

    <aside class="lado">
      <div class="ticket-wrap">
        <form id="comanda" class="ticket" autocomplete="off">
          <h2 class="ticket-titulo">Sua comanda</h2>
          <label>Nome do aluno<input id="aluno-nome" maxlength="80" required></label>
          <label>Turma<input id="aluno-turma" maxlength="20" required placeholder="ex.: 2º B"></label>
          <ul id="linhas" class="linhas"></ul>
          <p class="total"><span>Total</span><strong id="total">R$ 0,00</strong></p>
          <p id="aviso" class="aviso" role="status"></p>
          <button class="btn-principal" id="confirmar" disabled>Confirmar pedido</button>
        </form>
      </div>
      <section class="meus" aria-labelledby="t-meus">
        <h2 id="t-meus" class="titulo-secao pequeno">Meus pedidos</h2>
        <ul id="meus" class="lista-meus"></ul>
      </section>
    </aside>
  </main>

  <main id="cozinha" role="tabpanel" aria-labelledby="aba-cozinha" hidden>
    <form id="porta" class="porta">
      <h2 class="titulo-secao">Área da cozinha</h2>
      <label>PIN da cantina<input id="pin" type="password" inputmode="numeric" autocomplete="off" required></label>
      <p id="porta-erro" class="aviso" role="alert"></p>
      <button class="btn-principal">Entrar</button>
    </form>
    <div id="painel" hidden>
      <section aria-labelledby="t-estoque">
        <h2 id="t-estoque" class="titulo-secao pequeno">Estoque</h2>
        <ul id="estoque" class="estoque"></ul>
      </section>
      <section aria-labelledby="t-fila">
        <h2 id="t-fila" class="titulo-secao pequeno">Fila de pedidos</h2>
        <div id="quadro" class="quadro"></div>
      </section>
      <button class="sair" id="sair">Sair da cozinha</button>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js" type="module"></script>
</body>
</html>
